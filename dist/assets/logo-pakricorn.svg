<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" fill="none">
  <defs>
    <linearGradient id="pak-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="pak-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>
    <filter id="pak-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Emblem: Geometric Futuristic 'P' with Diamond Vertex -->
  <g transform="translate(15, 10)">
    <rect x="0" y="0" width="88" height="88" rx="20" fill="#0d1538" stroke="#253275" stroke-width="2" />
    
    <!-- Outer Shield Frame -->
    <path d="M26 22 H54 C65 22 72 29 72 40 C72 51 65 58 54 58 H38 V74" stroke="#1c2859" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Stylized Glowing 'P' with tech prism -->
    <path d="M30 22 H54 C64 22 70 29 70 40 C70 51 64 58 54 58 H30 Z V74" stroke="url(#pak-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#pak-filter)" />
    
    <!-- Internal Diamond / Capricorn Star Node -->
    <polygon points="50,34 56,40 50,46 44,40" fill="#38bdf8" />
    <circle cx="50" cy="40" r="2" fill="#ffffff" />
    <circle cx="30" cy="74" r="3.5" fill="#818cf8" />
  </g>

  <!-- Typography -->
  <g transform="translate(120, 24)">
    <text x="0" y="34" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="0.5">PAKR<tspan fill="#818cf8">ICORN</tspan></text>
    <text x="0" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#818cf8" letter-spacing="2.5">TECHNOLOGIES PVT. LTD.</text>
    <line x1="0" y1="65" x2="250" y2="65" stroke="url(#pak-glow)" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
