<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" fill="none">
  <defs>
    <linearGradient id="chis-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="60%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <linearGradient id="chis-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>
    <filter id="chis-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Emblem: Geometric Interlocking Hexagon 'C' -->
  <g transform="translate(15, 10)">
    <rect x="0" y="0" width="88" height="88" rx="20" fill="#071533" stroke="#1e3f7a" stroke-width="2" />
    <path d="M68 28 L44 14 L20 28 L20 60 L44 74 L68 60" stroke="#153266" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M62 30 L44 20 L26 30 L26 58 L44 68 L62 58" stroke="url(#chis-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#chis-filter)" />
    <circle cx="62" cy="30" r="4" fill="#00e5ff" />
    <circle cx="62" cy="58" r="4" fill="#00b4d8" />
    <circle cx="44" cy="44" r="5" fill="#ffffff" />
    <line x1="26" y1="44" x2="39" y2="44" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" />
    <line x1="44" y1="44" x2="56" y2="44" stroke="url(#chis-glow)" stroke-width="3" stroke-linecap="round" />
    <circle cx="56" cy="44" r="3" fill="#38bdf8" />
  </g>

  <!-- Typography -->
  <g transform="translate(120, 24)">
    <text x="0" y="34" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="0.5">CHISELON</text>
    <text x="0" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#00d2ff" letter-spacing="2.5">TECHNOLOGIES PVT. LTD.</text>
    <line x1="0" y1="65" x2="250" y2="65" stroke="url(#chis-glow)" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
